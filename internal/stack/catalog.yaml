# Target stack catalog for the stack generator.
# Design: docs/superpowers/specs/2026-10-08-stack-generator-design.md (§3, §4).
#
# id            <runtime>-<ui>-<styling>-<build-system>; also the template dir name
# source_stacks mocks this template accepts (backend/prompts/prompt_types.py::Stack)
# build_system  pnpm | npm | bun
# phase         rollout phase (§10)
# status        available | in-progress | planned
#
# Build-system variants are separate entries so each is tested on its own.
# Only pnpm variants are listed for now; npm/bun variants arrive in phase 4.

version: 1

stacks:
  - id: static-html-pnpm
    source_stacks: [html_css, html_tailwind, react_tailwind, bootstrap, vue_tailwind, ionic_tailwind]
    build_system: pnpm
    phase: 1
    status: available

  - id: nextjs-react-tailwind-pnpm
    source_stacks: [react_tailwind]
    build_system: pnpm
    phase: 2
    status: available

  - id: vite-react-tailwind-pnpm
    source_stacks: [react_tailwind]
    build_system: pnpm
    phase: 3
    status: planned

  - id: vite-html-tailwind-pnpm
    source_stacks: [html_tailwind]
    build_system: pnpm
    phase: 3
    status: planned

  - id: nuxt-vue-tailwind-pnpm
    source_stacks: [vue_tailwind]
    build_system: pnpm
    phase: 3
    status: planned

  - id: vite-ionic-react-pnpm
    source_stacks: [ionic_tailwind]
    build_system: pnpm
    phase: 3
    status: planned
